<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Reels - ANKITSTUDIOAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{height:100%;overflow:hidden}
        body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#000;color:#fff;-webkit-user-select:none;user-select:none}

        /* ===== REELS CONTAINER ===== */
        .reels-container{width:100%;height:100vh;overflow:hidden;position:relative;scroll-snap-type:y mandatory;overflow-y:auto;scrollbar-width:none}
        .reels-container::-webkit-scrollbar{display:none}

        /* ===== SINGLE REEL ===== */
        .reel{width:100%;height:100vh;scroll-snap-align:start;position:relative;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden}
        .reel-media{width:100%;height:100%;object-fit:cover}
        .reel-media-image{width:100%;height:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .reel-media-image img{width:100%;height:100%;object-fit:cover}

        /* Gradient overlay for text */
        .reel-overlay{position:absolute;bottom:0;left:0;right:0;padding:16px 16px 80px;background:linear-gradient(transparent,rgba(0,0,0,0.8));z-index:2}

        /* Author info */
        .reel-author{display:flex;align-items:center;gap:10px;margin-bottom:10px}
        .reel-author-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#f09433,#bc1888);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;overflow:hidden;flex-shrink:0}
        .reel-author-av img{width:100%;height:100%;border-radius:50%;object-fit:cover}
        .reel-author-name{font-size:14px;font-weight:600}
        .reel-follow-btn{padding:4px 14px;background:#0095f6;border:none;border-radius:6px;font-size:12px;font-weight:600;color:#fff;cursor:pointer}
        .reel-follow-btn.following{background:transparent;border:1px solid rgba(255,255,255,0.4);color:#fff}

        /* Caption */
        .reel-caption{font-size:13px;line-height:1.4;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
        .reel-caption .cap-user{font-weight:600;margin-right:4px}
        .reel-caption-more{font-size:12px;color:rgba(255,255,255,0.7);cursor:pointer}

        /* Audio tag */
        .reel-audio{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,0.8);margin-top:4px}
        .reel-audio i{font-size:10px}
        .reel-audio-name{font-weight:600;cursor:pointer}
        .reel-audio-name:hover{text-decoration:underline}
        .reel-audio-spin{animation:spin 3s linear infinite}
        @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

        /* Right action bar */
        .reel-actions{position:absolute;right:12px;bottom:100px;z-index:3;display:flex;flex-direction:column;align-items:center;gap:18px}
        .reel-action{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
        .reel-action i{font-size:26px;color:#fff;transition:transform .15s}
        .reel-action:active i{transform:scale(.85)}
        .reel-action i.liked{color:#ed4956}
        .reel-action span{font-size:11px;font-weight:600;color:#fff}
        .reel-action-avatar{width:36px;height:36px;border-radius:50%;border:2px solid #fff;overflow:hidden;background:linear-gradient(135deg,#f09433,#bc1888);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}

        /* Progress bar for video */
        .reel-progress{position:absolute;bottom:64px;left:0;right:0;height:2px;background:rgba(255,255,255,0.2);z-index:4}
        .reel-progress-fill{height:100%;background:#fff;width:0%;transition:width .1s linear}

        /* ===== REEL UPLOAD ===== */
        #reelUploadModal{position:fixed;inset:0;z-index:99999;background:#000;display:none;flex-direction:column}
        #reelUploadModal.open{display:flex}
        .upload-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #333}
        .upload-title{font-size:16px;font-weight:700;color:#fff}
        .upload-close{background:none;border:none;font-size:22px;cursor:pointer;color:#fff}
        .upload-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:16px}
        .upload-preview{width:240px;height:360px;border-radius:16px;overflow:hidden;background:#1a1a1a;display:flex;align-items:center;justify-content:center}
        .upload-preview img{width:100%;height:100%;object-fit:cover}
        .upload-preview-placeholder{color:#555;text-align:center;font-size:14px}
        .upload-preview-placeholder i{font-size:48px;display:block;margin-bottom:12px;color:#333}
        .upload-input{width:100%;max-width:300px;background:transparent;border:1px solid #333;border-radius:10px;padding:10px 14px;color:#fff;font-size:14px;outline:none}
        .upload-input::placeholder{color:#555}
        .upload-btn{width:100%;max-width:300px;padding:12px;background:#0095f6;border:none;border-radius:8px;font-size:16px;font-weight:600;color:#fff;cursor:pointer}
        .upload-btn:disabled{background:#333;color:#666;cursor:not-allowed}
        .upload-file-btn{width:100%;max-width:300px;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:8px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;text-align:center}

        /* ===== AUDIO SEARCH MODAL ===== */
        #audioSearchModal{position:fixed;inset:0;z-index:100000;background:#fff;display:none;flex-direction:column;color:#000}
        #audioSearchModal.open{display:flex}
        .audio-header{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #efefef}
        .audio-back{background:none;border:none;font-size:20px;cursor:pointer;color:#000}
        .audio-search{flex:1;background:#efefef;border:none;border-radius:10px;padding:10px 14px;font-size:14px;outline:none;color:#000}
        .audio-search::placeholder{color:#8e8e8e}
        .audio-list{overflow-y:auto;flex:1;padding:8px 0}
        .audio-item{display:flex;align-items:center;gap:12px;padding:10px 16px;cursor:pointer}
        .audio-item:active{background:#f5f5f5}
        .audio-icon{width:44px;height:44px;border-radius:8px;background:linear-gradient(135deg,#f09433,#bc1888);display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .audio-icon i{color:#fff;font-size:18px}
        .audio-name{font-size:14px;font-weight:600}
        .audio-artist{font-size:12px;color:#8e8e8e}

        /* ===== BOTTOM NAV ===== */
        .ig-bottom-nav{position:fixed;bottom:0;left:0;width:100%;background:#000;border-top:1px solid #262626;display:flex;justify-content:space-around;align-items:center;padding:10px 0 12px;z-index:9999}
        .ig-bottom-nav i{font-size:24px;color:#fff;cursor:pointer}
        .ig-nav-profile{width:28px;height:28px;border-radius:50%;object-fit:cover;cursor:pointer;border:2px solid #fff}

        /* ===== COMMENTS MODAL ===== */
        #reelCommentsModal{position:fixed;inset:0;z-index:99998;background:#fff;display:none;flex-direction:column;color:#000;border-radius:16px 16px 0 0;margin-top:auto;max-height:60vh;bottom:0}
        #reelCommentsModal.open{display:flex}
        .rcm-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #efefef}
        .rcm-title{font-size:16px;font-weight:700}
        .rcm-close{background:none;border:none;font-size:22px;cursor:pointer;color:#000}
        .rcm-list{overflow-y:auto;flex:1;padding:8px 16px}
        .rcm-item{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #f5f5f5}
        .rcm-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#f09433,#bc1888);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
        .rcm-name{font-size:13px;font-weight:600}
        .rcm-text{font-size:13px;color:#333;margin-top:2px}
        .rcm-time{font-size:11px;color:#8e8e8e;margin-top:2px}
        .rcm-input-area{display:flex;align-items:center;gap:10px;padding:10px 16px;border-top:1px solid #efefef}
        .rcm-input{flex:1;border:none;background:#efefef;border-radius:20px;padding:10px 14px;font-size:13px;outline:none;color:#000}
        .rcm-send{width:36px;height:36px;border-radius:50%;background:#0095f6;border:none;color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}

        /* Dark mode for modals */
        body.dark-mode #audioSearchModal{background:#000}
        body.dark-mode .audio-header{border-color:#262626}
        body.dark-mode .audio-search{background:#262626;color:#fff;border-color:#333}
        body.dark-mode .audio-name{color:#fff}
        body.dark-mode #reelCommentsModal{background:#000}
        body.dark-mode .rcm-header{border-color:#262626}
        body.dark-mode .rcm-title{color:#fff}
        body.dark-mode .rcm-close{color:#fff}
        body.dark-mode .rcm-text{color:#ccc}
        body.dark-mode .rcm-input{background:#262626;color:#fff;border-color:#333}

        /* ===== REELS MUSIC & AUTO-SCROLL ADDITIONS ===== */
        /* Vinyl Record rotating disk */
        .reel-music-disc {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: linear-gradient(45deg, #111, #333, #111);
            border: 2px solid rgba(255,255,255,0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 12px;
            animation: spinDisc 2.5s linear infinite;
            animation-play-state: paused;
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);
            position: relative;
        }
        .reel-music-disc.playing {
            animation-play-state: running;
        }
        .reel-music-disc::after {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #000;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .reel-music-disc i {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            z-index: 1;
        }
        @keyframes spinDisc {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Marquee Song Title styling */
        .reel-audio-marquee {
            display: flex;
            overflow: hidden;
            white-space: nowrap;
            width: 160px;
            mask-image: linear-gradient(to right, transparent, black 8px, black 92%, transparent);
            -webkit-mask-image: linear-gradient(to right, transparent, black 8px, black 92%, transparent);
            background: rgba(255, 255, 255, 0.12);
            padding: 4px 8px;
            border-radius: 12px;
            backdrop-filter: blur(4px);
            align-items: center;
            gap: 6px;
        }
        .reel-audio-marquee i {
            color: #fff;
            font-size: 11px;
            animation: pulseMusic 1.5s ease-in-out infinite alternate;
        }
        @keyframes pulseMusic {
            0% { transform: scale(0.95); opacity: 0.8; }
            100% { transform: scale(1.15); opacity: 1; }
        }
        .reel-audio-marquee-text {
            display: inline-block;
            animation: runMarquee 10s linear infinite;
            font-weight: 500;
            font-size: 12px;
            color: #fff;
            padding-right: 12px;
        }
        @keyframes runMarquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }

        /* Auto-scroll floating pill */
        .autoscroll-toggle-pill {
            position: fixed;
            top: 14px;
            right: 14px;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 12px;
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            z-index: 9999;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .autoscroll-toggle-pill:hover {
            background: rgba(0, 0, 0, 0.75);
        }
        .autoscroll-toggle-pill:active {
            transform: scale(0.96);
        }
        .autoscroll-toggle-pill i {
            font-size: 11px;
            transition: color 0.2s;
        }
        .autoscroll-toggle-pill.active i {
            color: #0095f6;
        }

        /* Progress Bar for all reels (both image and video) */
        .reel-progress {
            position: absolute;
            bottom: 60px;
            left: 0;
            right: 0;
            height: 3px;
            background: rgba(255, 255, 255, 0.2);
            z-index: 10;
            cursor: pointer;
        }
        .reel-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #f09433, #bc1888, #0095f6);
            width: 0%;
            transition: width 0.1s linear;
        }

        /* Speaker Volume Overlay popup */
        .reel-volume-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.7);
            background: rgba(0, 0, 0, 0.65);
            border-radius: 50%;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .reel-volume-overlay.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1.1);
        }
        .reel-volume-overlay i {
            font-size: 28px;
            color: #fff;
        }
    </style>
</head>
<body>
<!-- Floating Auto-Scroll Toggle Pill -->

<script>if(sessionStorage.getItem('splash_shown')){document.documentElement.style.setProperty('--splash-display','none');}</script>

<!-- ===== REELS FEED ===== -->
<div class="reels-container" id="reelsFeed">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#8e8e8e">

<!-- ===== REEL UPLOAD ===== -->
<div id="reelUploadModal">

<div class="ig-bottom-nav">
    <i class="fas fa-home" onclick="window.location.href='index.html'"></i>

    <i class="fas fa-film" style="color:#fff;border-bottom:2px solid #fff;padding-bottom:4px"></i>
    <img src="" alt="Profile" class="ig-nav-profile" onclick="window.location.href='profile.html'">

<script>
function openMediaPicker(){
    window.location.href = 'index.html?openMediaPicker=1';
}
// Firebase initialized via firebase-config.js
const db=firebase.database();

let _myUid=null,_reelsCache=[],_currentReelId=null;

if(localStorage.getItem('ankitstudio_darkmode')==='true')document.body.classList.add('dark-mode');

// ===== AUDIO LIBRARY (Static for now, can be dynamic) =====
const AUDIO_LIBRARY=[
    {name:"Aesthetic Vibes",artist:"Lo-Fi Beats",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
    {name:"Neon Dreams",artist:"Synthwave",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"},
    {name:"Cosmic Journey",artist:"Space Ambient",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
    {name:"Midnight City",artist:"Chillhop",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"},
    {name:"Digital Rain",artist:"Cyberpunk OST",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"},
    {name:"Sunset Drive",artist:"Tropical House",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"},
    {name:"Ethereal Glow",artist:"Ambient",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3"},
    {name:"Retro Wave",artist:"80s Synth",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"},
    {name:"Bass Drop",artist:"EDM",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3"},
    {name:"Chill Mode",artist:"Lo-Fi Hip Hop",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-10.mp3"},
    {name:"Trending Now",artist:"Viral Hits",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-11.mp3"},
    {name:"Original Audio",artist:"Original",url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-12.mp3"},
];

// Central audio player for background music
const globalAudioPlayer = new Audio();
let isGlobalMuted = true; // Browser compatibility: start muted by default
globalAudioPlayer.muted = true;
let isAutoScrollActive = true; // Auto-scroll state (default true)
let activeReelElement = null; // Current active reel DOM node


firebase.auth().onAuthStateChanged(function(user){
    if(user){
        _myUid=user.uid;
        loadReels();
        loadAudioSearch();
    }else{
        window.location.href='index.html';
    }
});

// ===== REELS MUSIC & AUTOPLAY LOGIC HELPERS =====
function getAudioUrl(audioName) {
    if (!audioName) return AUDIO_LIBRARY[0].url;
    var nameClean = audioName.toLowerCase().trim();
    var found = AUDIO_LIBRARY.find(function(a) {
        return a.name.toLowerCase().includes(nameClean) || nameClean.includes(a.name.toLowerCase());
    });
    if (found) return found.url;
    
    // Hash function fallback to keep audio selection consistent per name
    var hash = 0;
    for (var i = 0; i < nameClean.length; i++) {
        hash = nameClean.charCodeAt(i) + ((hash << 5) - hash);
    }
    var idx = Math.abs(hash) % AUDIO_LIBRARY.length;
    return AUDIO_LIBRARY[idx].url;
}

let isScrollObserverSetup = false;
function setupReelsScrollObserver() {
    if (isScrollObserverSetup) return;
    var feed = document.getElementById('reelsFeed');
    if (!feed) return;
    
    var scrollTimeout;
    feed.addEventListener('scroll', function() {
        clearTimeout(scrollTimeout);
        scrollTimeout = setTimeout(handleReelSelection, 80);
    });
    
    isScrollObserverSetup = true;
}

function handleReelSelection() {
    var container = document.getElementById('reelsFeed');
    if (!container) return;
    var reels = container.querySelectorAll('.reel');
    if (reels.length === 0) return;
    
    var containerHeight = window.innerHeight;
    var maxVisibleHeight = 0;
    var newActiveReel = null;
    
    reels.forEach(function(reel) {
        var rect = reel.getBoundingClientRect();
        var visibleHeight = Math.min(rect.bottom, containerHeight) - Math.max(rect.top, 0);
        if (visibleHeight > maxVisibleHeight) {
            maxVisibleHeight = visibleHeight;
            newActiveReel = reel;
        }
    });
    
    if (newActiveReel && newActiveReel !== activeReelElement) {
        playActiveReel(newActiveReel);
    }
}

let activeVideo = null;
let progressInterval = null;

function playActiveReel(reel) {
    // Clean up previous active reel
    if (activeReelElement) {
        var prevVideo = activeReelElement.querySelector('video.reel-media');
        if (prevVideo) {
            prevVideo.pause();
            prevVideo.currentTime = 0;
        }
        var prevDisc = activeReelElement.querySelector('.reel-music-disc');
        if (prevDisc) prevDisc.classList.remove('playing');
        
        var prevProgressFill = activeReelElement.querySelector('.reel-progress-fill');
        if (prevProgressFill) prevProgressFill.style.width = '0%';
    }
    
    clearInterval(progressInterval);
    globalAudioPlayer.pause();
    
    // Set new active reel
    activeReelElement = reel;
    var reelId = reel.dataset.reelId;
    var video = reel.querySelector('video.reel-media');
    var disc = reel.querySelector('.reel-music-disc');
    var audioName = reel.dataset.audioName || '';
    
    // Determine audio URL
    var audioUrl = getAudioUrl(audioName);
    
    // Play media
    if (video) {
        activeVideo = video;
        video.muted = isGlobalMuted;
        
        // If there's background music tag, play music, mute video
        var playsMusic = audioName && audioName.toLowerCase() !== 'original' && audioName.toLowerCase() !== 'original audio';
        if (playsMusic) {
            video.muted = true; // Video is muted, music plays
            globalAudioPlayer.src = audioUrl;
            globalAudioPlayer.muted = isGlobalMuted;
            if (!isGlobalMuted) {
                globalAudioPlayer.play().catch(function(e){ console.log("Audio autoplay blocked: ", e); });
                if (disc) disc.classList.add('playing');
            }
        } else {
            // Original video audio
            if (!isGlobalMuted) {
                video.muted = false;
                if (disc) disc.classList.add('playing');
            } else {
                video.muted = true;
            }
        }
        
        video.play().catch(function(e) {
            console.log("Video autoplay blocked: ", e);
        });
        
        // Track video progress
        progressInterval = setInterval(function() {
            if (video.duration) {
                var pct = (video.currentTime / video.duration) * 100;
                var fill = reel.querySelector('.reel-progress-fill');
                if (fill) fill.style.width = pct + '%';
            }
        }, 100);
        
        // Video finished handler
        video.onended = function() {
            if (isAutoScrollActive) {
                scrollNextReel();
            }
        };
    } else {
        // Image Reel
        activeVideo = null;
        globalAudioPlayer.src = audioUrl;
        globalAudioPlayer.muted = isGlobalMuted;
        if (!isGlobalMuted) {
            globalAudioPlayer.play().catch(function(e){ console.log("Audio autoplay blocked: ", e); });
            if (disc) disc.classList.add('playing');
        }
        
        // Track global audio progress for image reels
        progressInterval = setInterval(function() {
            if (globalAudioPlayer.duration) {
                var pct = (globalAudioPlayer.currentTime / globalAudioPlayer.duration) * 100;
                var fill = reel.querySelector('.reel-progress-fill');
                if (fill) fill.style.width = pct + '%';
            }
        }, 100);
        
        // Audio finished handler
        globalAudioPlayer.onended = function() {
            if (isAutoScrollActive) {
                scrollNextReel();
            }
        };
    }
}

function scrollNextReel() {
    var container = document.getElementById('reelsFeed');
    if (!container || !activeReelElement) return;
    var next = activeReelElement.nextElementSibling;
    if (next && next.classList.contains('reel')) {
        next.scrollIntoView({ behavior: 'smooth' });
    }
}

function toggleActiveReelMute(reel) {
    isGlobalMuted = !isGlobalMuted;
    
    // Toggle global speaker overlay
    var overlay = reel.querySelector('.reel-volume-overlay');
    if (overlay) {
        var icon = overlay.querySelector('i');
        if (isGlobalMuted) {
            icon.className = 'fas fa-volume-mute';
        } else {
            icon.className = 'fas fa-volume-up';
        }
        overlay.classList.add('show');
        setTimeout(function() {
            overlay.classList.remove('show');
        }, 800);
    }
    
    // Apply sound state
    var video = reel.querySelector('video.reel-media');
    var disc = reel.querySelector('.reel-music-disc');
    var audioName = reel.dataset.audioName || '';
    
    var playsMusic = audioName && audioName.toLowerCase() !== 'original' && audioName.toLowerCase() !== 'original audio';
    
    if (isGlobalMuted) {
        globalAudioPlayer.muted = true;
        globalAudioPlayer.pause();
        if (video) video.muted = true;
        if (disc) disc.classList.remove('playing');
    } else {
        if (video) {
            if (playsMusic) {
                video.muted = true; // Keep video muted, play music
                globalAudioPlayer.muted = false;
                globalAudioPlayer.play().catch(function(e){});
            } else {
                video.muted = false; // Original audio, play video unmuted
            }
        } else {
            // Image, play music
            globalAudioPlayer.muted = false;
            globalAudioPlayer.play().catch(function(e){});
        }
        if (disc) disc.classList.add('playing');
    }
}

function toggleAutoScrollPill() {
    isAutoScrollActive = !isAutoScrollActive;
    var pill = document.getElementById('autoScrollPill');
    if (pill) {
        var span = pill.querySelector('span');
        var icon = pill.querySelector('i');
        if (isAutoScrollActive) {
            pill.classList.add('active');
            span.textContent = 'Auto-Scroll: On';
            showToast('Auto-scroll activated 🎬');
        } else {
            pill.classList.remove('active');
            span.textContent = 'Auto-Scroll: Off';
            showToast('Auto-scroll deactivated ✕');
        }
    }
}

        _reelsCache=[];
        if(!snap.exists()){

            loadPostsAsReels();
            return;

        var reels=[];
        snap.forEach(function(c){reels.unshift({key:c.key,data:c.val()})});

        reels.forEach(function(reel){

}

// ===== REEL INTERACTIONS =====
function toggleReelLike(el,reelId){
    var icon=el.querySelector('i');
    var span=el.querySelector('span');
    var wasLiked=icon.classList.contains('liked');
    if(wasLiked){icon.classList.remove('liked','fas');icon.classList.add('far');span.textContent=parseInt(span.textContent)-1}
    else{icon.classList.remove('far');icon.classList.add('fas','liked');icon.style.transform='scale(1.3)';setTimeout(function(){icon.style.transform=''},200);span.textContent=parseInt(span.textContent)+1}
    db.ref('reels/'+reelId+'/likes').transaction(function(c){return(c||0)+(wasLiked?-1:1)});
}

function toggleReelSave(el){
    var icon=el.querySelector('i');
    if(icon.classList.contains('saved')){icon.classList.remove('saved','fas');icon.classList.add('far')}
    else{icon.classList.remove('far');icon.classList.add('fas','saved')}
}

function toggleReelFollow(btn,authorId){
    if(!_myUid)return;
    if(btn.classList.contains('following')){
        btn.classList.remove('following');btn.textContent='Follow';
        db.ref('users/'+_myUid+'/following/'+authorId).remove();
        db.ref('users/'+authorId+'/followers/'+_myUid).remove();
    }else{
        btn.classList.add('following');btn.textContent='Following';
        db.ref('users/'+_myUid+'/following/'+authorId).set({createdAt:firebase.database.ServerValue.TIMESTAMP});
        db.ref('users/'+authorId+'/followers/'+_myUid).set({createdAt:firebase.database.ServerValue.TIMESTAMP});
    }
}

var _reelMediaUrl='';
function openReelUpload(){
    document.getElementById('reelUploadModal').classList.add('open');
    document.getElementById('reelPreview').innerHTML='<div class="upload-preview-placeholder"><i class="fas fa-film"></i>Select a photo/video</div>';

}
function closeReelUpload(){document.getElementById('reelUploadModal').classList.remove('open')}

function previewReelMedia(input){
    if(!input.files||!input.files[0])return;
    var file=input.files[0];
    var isVideo=file.type.startsWith('video');
    var reader=new FileReader();
    reader.onload=function(e){
        if(isVideo){
            document.getElementById('reelPreview').innerHTML='<video src="'+e.target.result+'" style="width:100%;height:100%;object-fit:cover" muted autoplay loop></video>';
        }else{
            document.getElementById('reelPreview').innerHTML='<img src="'+e.target.result+'">';
        }
        document.getElementById('reelShareBtn').disabled=false;
    };
    reader.readAsDataURL(file);
}

function shareReel(){
    if(!_myUid)return;
    var fileInput=document.getElementById('reelFileInput');
    var caption=document.getElementById('reelCaption').value.trim();
    var audioName=document.getElementById('reelAudioName').value;
    var audioArtist=document.getElementById('reelAudioArtist').value;
    var btn=document.getElementById('reelShareBtn');
    btn.textContent='Sharing...';btn.disabled=true;
    var user=firebase.auth().currentUser;
    var authorName=user?(user.displayName||(user.email?user.email.split('@')[0]:'User')):'User';

    if(fileInput.files&&fileInput.files[0]){
        var file=fileInput.files[0];
        var isVideo=file.type.startsWith('video');
        var fd=new FormData();fd.append("image",file);
        fetch("https://api.imgbb.com/1/upload?key=5f30b483ae91c03320748137616415d7",{method:"POST",body:fd})
        .then(function(r){return r.json()})
        .then(function(d){
            var url=d.success?d.data.url:'';
            saveReelToDb(url,isVideo,caption,audioName,audioArtist,authorName);
        }).catch(function(){saveReelToDb('',isVideo,caption,audioName,audioArtist,authorName)});
    }else{
        saveReelToDb('',false,caption,audioName,audioName,authorName);
    }
}

function saveReelToDb(url,isVideo,caption,audioName,audioArtist,authorName){
    var reelData={
        imageUrl:url,
        videoUrl:isVideo?url:'',
        type:isVideo?'video':'image',
        caption:caption,
        audioName:audioName,
        audioArtist:audioArtist,
        uid:_myUid,
        authorId:_myUid,
        authorName:authorName,
        likes:0,
        comments:0,
        shares:0,
        timestamp:firebase.database.ServerValue.TIMESTAMP
    };
    db.ref('reels').push(reelData).then(function(){
        closeReelUpload();showToast('Reel shared! 🎬');
        btn=document.getElementById('reelShareBtn');btn.textContent='Share Reel';btn.disabled=false;
    }).catch(function(err){showToast('Error: '+err.message)});
}

function shareReelPost(postId){window.location.href='messages.html?sharePost='+encodeURIComponent(postId)}
function shareReelExternal(reelId){if(navigator.share){navigator.share({title:'Check this reel!',url:window.location.href}).catch(function(){})}else{showToast('Link copied!')}}

// ===== HELPERS =====
function esc(s){var d=document.createElement('div');d.appendChild(document.createTextNode(s||''));return d.innerHTML}
function fmtTime(ts){if(!ts)return'';var diff=Date.now()-ts,mins=Math.floor(diff/60000);if(mins<1)return'Just now';if(mins<60)return mins+'m';var hrs=Math.floor(mins/60);if(hrs<24)return hrs+'h';return Math.floor(hrs/24)+'d'}
function showToast(msg){var t=document.createElement('div');t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#262626;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;z-index:999999';t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove()},2000)}

// Video progress tracking
document.addEventListener('play',function(e){
    if(e.target.tagName==='VIDEO'){
        var reel=e.target.closest('.reel');
        if(!reel)return;
        var reelId=reel.dataset.reelId;
        var video=e.target;
        video.onprogress=function(){
            if(video.duration){
                var pct=(video.currentTime/video.duration)*100;
                var bar=document.getElementById('progress-'+reelId);
                if(bar)bar.style.width=pct+'%';
            }
        };
        video.ontimeupdate=video.onprogress;
    }
},true);
