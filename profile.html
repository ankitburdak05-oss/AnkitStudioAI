<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile — AnkitStudioAI</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="css/style.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <style>
        body { padding-left: 0 !important; background: #ffffff !important; }
        
        .ig-explore-grid {
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 3px; 
            padding-top: 3px;
        }
        .ig-explore-grid img { 
            width: 100%; 
            aspect-ratio: 1/1; 
            object-fit: cover; 
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="ig-profile-section" style="padding-bottom: 60px;">
    <div class="ig-container">
        <div class="ig-header-nav">
            <i class="fas fa-plus" style="cursor: pointer;" id="top-left-icon"></i>
            <div class="ig-username" id="top-title">ankitburdakk <i class="fas fa-chevron-down" style="font-size: 12px; margin-left: 4px; cursor: pointer;"></i></div>
            <i class="fas fa-bars" style="cursor: pointer;" id="top-right-icon"></i>
        </div>

        <div id="search-content-wrap" style="display: none;">
            <div style="padding: 10px 16px; border-bottom: 1px solid #efefef;">
                <div style="background: #efefef; border-radius: 10px; display: flex; align-items: center; padding: 8px 12px;">
                    <i class="fas fa-search" style="color: #8e8e8e; font-size: 14px;"></i>
                    <input type="text" id="ig-search-input" placeholder="Search prompts or users..." style="border: none; background: transparent; outline: none; margin-left: 10px; width: 100%; font-size: 14px; color: #000;">
                </div>
            </div>
            <div class="ig-explore-grid">
                </div>
        </div>

        <div id="profile-content-wrap">
            <div class="ig-profile-info">
                <div class="ig-avatar-box">
                    <img src="https://via.placeholder.com/150" alt="Avatar" id="main-profile-pic">
                    <div class="ig-add-story"><i class="fas fa-plus"></i></div>
                </div>
                <div class="ig-stats-box">
                    <div class="ig-stat"><strong id="igRealPosts">0</strong><span>posts</span></div>
                    <div class="ig-stat"><strong id="igRealFollowers">0</strong><span>followers</span></div>
                    <div class="ig-stat"><strong id="igRealFollowing">0</strong><span>following</span></div>
                </div>
            </div>

            <div class="ig-bio-section">
                <div class="ig-name" id="main-profile-name">Ankit Burdak</div>
                <div class="ig-category">Reel creator</div>
                <div class="ig-bio-text">Welcome to my AI Prompt Studio 🚀<br>DM for collabs</div>
            </div>

            <div class="ig-dashboard-banner" id="pro-dashboard">
                <strong>Professional dashboard</strong>
                <span>295 views in the last 30 days.</span>
            </div>

            <div class="ig-action-buttons" id="dynamic-action-buttons">
    <button>Edit profile</button>
    <button>Share profile</button>
</div>

            <div class="ig-highlights-container">
                <div class="ig-highlight">
                    <div class="ig-highlight-img new-hl"><i class="fas fa-plus"></i></div>
                    <span>New</span>
                </div>
                <div class="ig-highlight">
                    <div class="ig-highlight-img"><img src="https://via.placeholder.com/100?text=HL1"></div>
                    <span>Highlights</span>
                </div>
            </div>

            <div class="ig-tabs-container">
                <div class="ig-tab active"><i class="fas fa-th"></i></div>
                <div class="ig-tab"><i class="far fa-play-circle"></i></div>
                <div class="ig-tab"><i class="far fa-user-circle"></i></div>
            </div>

            <div class="ig-photo-grid" id="profile-photo-grid">
                <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400">
                <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400">
                <img src="https://images.unsplash.com/photo-1525547719571-a2d4ac8945e2?w=400">
            </div>
        </div>
    </div>

    <div class="ig-bottom-nav" id="bottom-nav-bar">
        <i class="fas fa-home" onclick="window.location.href='index.html'"></i>
        <i class="fas fa-search" id="ig-search-btn" style="cursor: pointer;"></i> 
        <i class="far fa-play-circle"></i>
        <i class="far fa-plus-square"></i>
        <i class="far fa-paper-plane"></i>
        <img src="https://via.placeholder.com/150" alt="Profile" class="ig-nav-profile" id="ig-profile-btn" style="cursor: pointer;">
    </div>
</div>

<script src="js/firebase-config.js"></script>
<script src="js/app.js"></script>


<script>
    document.addEventListener("DOMContentLoaded", () => {
        const searchInput = document.getElementById('ig-search-input');
        const exploreGrid = document.querySelector('.ig-explore-grid');
        const bottomNav = document.getElementById('bottom-nav-bar') || document.querySelector('.ig-bottom-nav');
        const proDashboard = document.getElementById('pro-dashboard');
        const topTitle = document.getElementById('top-title');
        const mainProfileName = document.getElementById('main-profile-name');
        const topLeftIcon = document.getElementById('top-left-icon');
        const topRightIcon = document.getElementById('top-right-icon');
        let btnContainer = document.getElementById('dynamic-action-buttons');

        // 🔥 LISTENERS TRACKER
        let currentStatsFollowersRef = null;
        let currentStatsFollowingRef = null;
        let currentStatsPostsRef = null;
        let currentFollowButtonRef = null;

        let searchResultsList = document.getElementById('ig-search-results-list');
        if (!searchResultsList && exploreGrid) {
            searchResultsList = document.createElement('div');
            searchResultsList.id = 'ig-search-results-list';
            searchResultsList.style.display = 'none';
            searchResultsList.style.padding = '0 16px';
            exploreGrid.parentNode.insertBefore(searchResultsList, exploreGrid.nextSibling);
        }

        let userCacheMap = {};
        firebase.database().ref('submitted_prompts').on('value', snap => {
            if (snap.exists()) {
                snap.forEach(child => {
                    const d = child.val();
                    if (d.authorId) {
                        userCacheMap[d.authorId] = {
                            name: d.authorName || 'User',
                            email: d.authorEmail || ''
                        };
                    }
                });
            }
        });

        function clearActiveListeners() {
            if (currentStatsFollowersRef) currentStatsFollowersRef.off();
            if (currentStatsFollowingRef) currentStatsFollowingRef.off();
            if (currentStatsPostsRef) currentStatsPostsRef.off();
            if (currentFollowButtonRef) currentFollowButtonRef.off();
        }

        function attachProfileStatsListener(uid) {
            clearActiveListeners();

            currentStatsFollowersRef = firebase.database().ref('users/' + uid + '/followers');
            currentStatsFollowersRef.on('value', (snap) => {
                const countEl = document.getElementById('igRealFollowers');
                if (countEl) countEl.innerText = snap.exists() ? snap.numChildren() : 0;
            });

            currentStatsFollowingRef = firebase.database().ref('users/' + uid + '/following');
            currentStatsFollowingRef.on('value', (snap) => {
                const countEl = document.getElementById('igRealFollowing');
                if (countEl) countEl.innerText = snap.exists() ? snap.numChildren() : 0;
            });

            currentStatsPostsRef = firebase.database().ref('submitted_prompts');
            currentStatsPostsRef.on('value', (snap) => {
                let count = 0;
                if (snap.exists()) {
                    snap.forEach(child => {
                        if (child.val().authorId === uid) count++;
                    });
                }
                const countEl = document.getElementById('igRealPosts');
                if (countEl) countEl.innerText = count;
            });
        }

        function loadExploreGridPhotos() {
            if (!exploreGrid) return;
            firebase.database().ref('submitted_prompts').limitToLast(15).once('value', (snapshot) => {
                if (snapshot.exists()) {
                    exploreGrid.innerHTML = '';
                    snapshot.forEach((child) => {
                        const data = child.val();
                        exploreGrid.innerHTML += `
                            <img src="${data.imageUrl}" onclick="openUserProfile('${data.authorId}', '${data.authorName || 'User'}')" style="width: 100%; aspect-ratio: 1/1; object-fit: cover; cursor: pointer;">
                        `;
                    });
                }
            });
        }

        if (document.getElementById('ig-search-btn')) {
            document.getElementById('ig-search-btn').addEventListener('click', function() {
                document.getElementById('profile-content-wrap').style.display = 'none'; 
                document.getElementById('search-content-wrap').style.display = 'block'; 
                
                if (topTitle) topTitle.innerHTML = 'Explore'; 
                document.getElementById('ig-search-btn').style.color = '#000'; 
                if (topLeftIcon) topLeftIcon.style.display = 'none';
                if (topRightIcon) topRightIcon.style.display = 'none';

                loadExploreGridPhotos();
                exploreGrid.style.display = 'grid';
                if (searchResultsList) searchResultsList.style.display = 'none';
                if (searchInput) searchInput.value = ''; 
            });
        }

        if (searchInput && exploreGrid) {
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase().trim();
                
                if (searchTerm === '') {
                    exploreGrid.style.display = 'grid';
                    searchResultsList.style.display = 'none';
                    return;
                }

                exploreGrid.style.display = 'none';
                searchResultsList.style.display = 'block';
                searchResultsList.innerHTML = ''; 
                
                let matchFound = false;
                let uniqueUsers = new Set(); 

                Object.keys(userCacheMap).forEach(uid => {
                    const user = userCacheMap[uid];
                    const uName = user.name.toLowerCase();
                    const uEmail = user.email.toLowerCase();

                    if (uName.includes(searchTerm) || uEmail.includes(searchTerm)) {
                        if (!uniqueUsers.has(uid)) {
                            uniqueUsers.add(uid);
                            matchFound = true;
                            
                            const username = uEmail ? uEmail.split('@')[0].toLowerCase() : uName.replace(/\s+/g, '');

                            searchResultsList.innerHTML += `
                                <div onclick="openUserProfile('${uid}', '${user.name}')" style="display: flex; align-items: center; padding: 10px 0; gap: 14px; cursor: pointer;">
                                    <div style="width: 54px; height: 54px; border-radius: 50%; border: 1px solid #dbdbdb; padding: 2px; flex-shrink: 0;">
                                        <img src="https://via.placeholder.com/150" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">
                                    </div>
                                    <div style="flex: 1; border-bottom: 1px solid #efefef; padding-bottom: 10px; display: flex; flex-direction: column; justify-content: center;">
                                        <div style="font-size: 14px; font-weight: 600; color: #000;">${username}</div>
                                        <div style="font-size: 13px; color: #8e8e8e;">${user.name}</div>
                                    </div>
                                </div>
                            `;
                        }
                    }
                });

                if (!matchFound) {
                    searchResultsList.innerHTML = `<div style="text-align: center; color: #8e8e8e; padding: 40px 10px; font-size: 14px;">Bhai, is ID se koi user nahi mila.</div>`;
                }
            });
        }

        // 🔥 NAYA: Button render karne ka alag function taaki turant update ho sake
        window.renderFollowButton = function(targetId, isFollowing) {
            let container = document.getElementById('dynamic-action-buttons') || document.querySelector('.ig-action-buttons');
            if (!container) return;

            if (isFollowing) {
                container.innerHTML = `
                    <button onclick="toggleFollow('${targetId}', true)" style="background: #efefef; color: #000; border: none; padding: 6px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 5px;">Following <i class="fas fa-chevron-down" style="font-size:10px;"></i></button>
                    <button style="background: #efefef; color: #000; border: none; padding: 6px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">Message</button>
                `;
            } else {
                container.innerHTML = `
                    <button onclick="toggleFollow('${targetId}', false)" style="background: #0095f6; color: white; border: none; padding: 6px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 5px;">Follow</button>
                    <button style="background: #efefef; color: #000; border: none; padding: 6px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">Message</button>
                `;
            }
        };

        window.openUserProfile = function(authorId, authorName) {
            const currentUser = firebase.auth().currentUser;
            if (!currentUser) { alert("Pehle login kar bhai!"); return; }

            attachProfileStatsListener(authorId);

            if (authorId === currentUser.uid) {
                document.getElementById('ig-profile-btn').click(); 
                return;
            } 

            document.getElementById('search-content-wrap').style.display = 'none'; 
            document.getElementById('profile-content-wrap').style.display = 'block';

            if (bottomNav) bottomNav.style.display = 'none'; 
            if (proDashboard) proDashboard.style.display = 'none';
            if (topLeftIcon) topLeftIcon.style.display = 'none';
            if (topRightIcon) topRightIcon.style.display = 'none';
            
            const cleanUsername = authorName ? authorName.replace(/\s+/g, '').toLowerCase() : 'user';
            if (topTitle) topTitle.innerHTML = `<i class="fas fa-arrow-left" onclick="goBackToSearch()" style="margin-right: 15px; cursor: pointer;"></i> ${cleanUsername}`; 
            if (mainProfileName) mainProfileName.innerHTML = authorName;

            // Pehle Default button daal do
            renderFollowButton(authorId, false);

            // Firebase check karega original state ke liye
            currentFollowButtonRef = firebase.database().ref('users/' + currentUser.uid + '/following/' + authorId);
            currentFollowButtonRef.on('value', (snapshot) => {
                renderFollowButton(authorId, snapshot.exists());
            });
        };

        window.goBackToSearch = function() {
            clearActiveListeners();
            document.getElementById('profile-content-wrap').style.display = 'none'; 
            document.getElementById('search-content-wrap').style.display = 'block'; 
            if (topTitle) topTitle.innerHTML = 'Explore'; 
            if (bottomNav) bottomNav.style.display = 'flex'; 
        };

        if (document.getElementById('ig-profile-btn')) {
            document.getElementById('ig-profile-btn').addEventListener('click', function() {
                const currentUser = firebase.auth().currentUser;
                
                document.getElementById('search-content-wrap').style.display = 'none'; 
                document.getElementById('profile-content-wrap').style.display = 'block'; 
                
                if (topTitle) topTitle.innerHTML = 'ankitburdakk <i class="fas fa-chevron-down" style="font-size: 12px; margin-left: 4px; cursor: pointer;"></i>'; 
                if (mainProfileName) mainProfileName.innerHTML = 'Ankit Burdak'; 
                if (topLeftIcon) topLeftIcon.style.display = 'block';
                if (topRightIcon) topRightIcon.style.display = 'block';
                if (proDashboard) proDashboard.style.display = 'block';
                if (bottomNav) bottomNav.style.display = 'flex'; 

                if (currentUser) {
                    attachProfileStatsListener(currentUser.uid);
                }

                let container = document.getElementById('dynamic-action-buttons') || document.querySelector('.ig-action-buttons');
                if (container) {
                    container.innerHTML = `
                        <button style="background: #efefef; color: #000; border: none; padding: 6px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-right: 5px;">Edit profile</button>
                        <button style="background: #efefef; color: #000; border: none; padding: 6px 20px; border-radius: 8px; font-weight: 600; cursor: pointer;">Share profile</button>
                    `;
                }
            });
        }

        // 🔥 1. STATS UPDATER (Firebase stats node se read karega)
        window.attachProfileStatsListener = function(uid) {
            // Followers count reader
            firebase.database().ref('users/' + uid + '/stats/followersCount').on('value', (snap) => {
                const count = snap.val() || 0;
                console.log("Followers count updated to:", count);
                const el = document.getElementById('igRealFollowers');
                if (el) el.innerText = count;
            });
            
            // Following count reader
            firebase.database().ref('users/' + uid + '/stats/followingCount').on('value', (snap) => {
                const count = snap.val() || 0;
                console.log("Following count updated to:", count);
                const el = document.getElementById('igRealFollowing');
                if (el) el.innerText = count;
            });
        };

        // 🔥 2. INSTANT FOLLOW / UNFOLLOW (Transaction increment fix)
        window.toggleFollow = function(targetUserId, isFollowing) {
            const currentUser = firebase.auth().currentUser;
            if (!currentUser) return;

            const myFollowingRef = firebase.database().ref('users/' + currentUser.uid + '/following/' + targetUserId);
            const targetFollowerRef = firebase.database().ref('users/' + targetUserId + '/followers/' + currentUser.uid);

            const myFollowingCountRef = firebase.database().ref('users/' + currentUser.uid + '/stats/followingCount');
            const targetFollowersCountRef = firebase.database().ref('users/' + targetUserId + '/stats/followersCount');

            if (isFollowing) {
                // UNFOLLOW
                myFollowingRef.remove();
                targetFollowerRef.remove();
                // Decrement (-1)
                myFollowingCountRef.transaction(c => (c || 1) - 1);
                targetFollowersCountRef.transaction(c => (c || 1) - 1);
                renderFollowButton(targetUserId, false);
            } else {
                // FOLLOW
                myFollowingRef.set(true);
                targetFollowerRef.set(true);
                // Increment (+1)
                myFollowingCountRef.transaction(c => (c || 0) + 1);
                targetFollowersCountRef.transaction(c => (c || 0) + 1);
                renderFollowButton(targetUserId, true);
            }
        };

        firebase.auth().onAuthStateChanged(user => {
            if (user && document.getElementById('profile-content-wrap').style.display !== 'none') {
                const currentTitle = topTitle ? topTitle.innerText : '';
                if (!currentTitle.includes('Explore') && currentTitle.trim().startsWith('ankitburdakk')) {
                    attachProfileStatsListener(user.uid);
                }
            }
        });
    });
</script>

</body>
</html>
